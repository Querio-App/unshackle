name: Orders by status
tableName: orders
slug: recent-orders
spaceSlug: sales
version: 1
metricQuery:
  exploreName: orders
  dimensions:
    - orders_status
  metrics:
    - orders_order_count
    - orders_total_revenue
  filters: {}
  sorts:
    - fieldId: orders_order_count
      descending: true
  limit: 100
  tableCalculations:
    - name: revenue_share
      displayName: Revenue share
      sql: ${orders.total_revenue} / SUM(${orders.total_revenue}) OVER ()
      format:
        type: percent
chartConfig:
  type: table
  config:
    showColumnCalculation: false
    showRowCalculation: false
