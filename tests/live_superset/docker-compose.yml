# Apache Superset 6.1.0 plus a Postgres warehouse with the synthetic Dunder Mifflin data.
# Host ports: Postgres 57432, Superset 8188.  docker-compose -p unshackle-ss up -d --build / down -v
services:
  warehouse:
    image: postgres:16-alpine
    container_name: unshackle-ss-warehouse
    environment:
      POSTGRES_USER: dunder
      POSTGRES_PASSWORD: dunder
      POSTGRES_DB: dunder
    ports: ["57432:5432"]
    volumes: ["./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dunder", "-d", "dunder"]
      interval: 2s
      retries: 30
  superset:
    build: .
    image: unshackle-ss-superset:6.1.0
    container_name: unshackle-ss-superset
    environment:
      SUPERSET_CONFIG_PATH: /app/unshackle/superset_config.py
    volumes: ["./superset_config.py:/app/unshackle/superset_config.py:ro"]
    command: ["sh", "-c", "superset db upgrade && superset fab create-admin --username admin --firstname Ada --lastname Admin --email admin@example.com --password Unshackle-test-1! && superset init && gunicorn -w 2 -k gthread --threads 4 -b 0.0.0.0:8088 --timeout 120 'superset.app:create_app()'"]
    ports: ["8188:8088"]
    depends_on:
      warehouse: {condition: service_healthy}
