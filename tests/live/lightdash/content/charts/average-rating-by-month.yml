version: 1
name: Average rating by month
description: Not on a dashboard, so it migrates as a verified query.
slug: average-rating-by-month
spaceSlug: sales
tableName: reviews
metricQuery:
  exploreName: reviews
  dimensions: [reviews_reviewed_at_month]
  metrics: [reviews_average_rating, reviews_review_count]
  filters: {}
  sorts: [{fieldId: reviews_reviewed_at_month, descending: false}]
  limit: 500
  tableCalculations: []
  additionalMetrics: []
chartConfig:
  type: cartesian
  config:
    layout:
      xField: reviews_reviewed_at_month
      yField: [reviews_average_rating]
    eChartsConfig:
      series:
        - type: line
          encode:
            xRef: {field: reviews_reviewed_at_month}
            yRef: {field: reviews_average_rating}
