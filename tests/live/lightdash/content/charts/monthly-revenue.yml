version: 1
name: Monthly revenue
description: Revenue and orders by month of purchase, H1 2025.
slug: monthly-revenue
spaceSlug: sales
tableName: orders
metricQuery:
  exploreName: orders
  dimensions: [orders_purchased_at_month]
  metrics: [orders_total_revenue, orders_order_count]
  filters:
    dimensions:
      and:
        - target: {fieldId: orders_purchased_at}
          operator: inBetween
          values: ["2025-01-01", "2025-06-30"]
  sorts: [{fieldId: orders_purchased_at_month, descending: false}]
  limit: 500
  tableCalculations: []
  additionalMetrics: []
chartConfig:
  type: cartesian
  config:
    layout:
      xField: orders_purchased_at_month
      yField: [orders_total_revenue]
    eChartsConfig:
      series:
        - type: bar
          encode:
            xRef: {field: orders_purchased_at_month}
            yRef: {field: orders_total_revenue}
