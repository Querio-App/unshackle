# Self-hosted Lightdash, after https://github.com/lightdash/lightdash/blob/main/docker-compose.yml
# (no headless browser: scheduled deliveries and screenshots aren't needed here).
# Layered on tests/live/docker-compose.warehouse.yml; secrets are generated per run by the harness.
services:
  lightdash-db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: lightdash
      POSTGRES_PASSWORD: ${UNSHACKLE_LIVE_PG_PASSWORD:?set by tests/live/harness.py}
      POSTGRES_DB: lightdash
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightdash -d lightdash"]
      interval: 2s
      retries: 30

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: unshackle
      MINIO_ROOT_PASSWORD: ${UNSHACKLE_LIVE_PG_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        minio server /data &
        until mc alias set local http://localhost:9000 unshackle "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done
        mc mb -p local/default
        wait

  lightdash:
    # amd64 only; on Apple silicon it runs under emulation (see tests/live/README.md).
    platform: linux/amd64
    image: lightdash/lightdash:${UNSHACKLE_LIVE_LIGHTDASH_VERSION:-3.23.1}
    depends_on:
      lightdash-db: {condition: service_healthy}
      warehouse: {condition: service_healthy}
      minio: {condition: service_started}
    environment:
      PGHOST: lightdash-db
      PGPORT: "5432"
      PGUSER: lightdash
      PGPASSWORD: ${UNSHACKLE_LIVE_PG_PASSWORD}
      PGDATABASE: lightdash
      LIGHTDASH_SECRET: ${UNSHACKLE_LIVE_SECRET:?set by tests/live/harness.py}
      SECURE_COOKIES: "false"
      TRUST_PROXY: "false"
      PORT: "8080"
      SITE_URL: http://localhost:${UNSHACKLE_LIVE_LIGHTDASH_PORT:-58080}
      LIGHTDASH_INSTALL_TYPE: docker_image
      LIGHTDASH_MIGRATION_EXECUTION_MODE: compose
      LIGHTDASH_QUERY_MAX_LIMIT: "5000"
      HEADWAY_ENABLED: "false"
      RUDDERSTACK_ANALYTICS_DISABLED: "true"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: default
      S3_ACCESS_KEY: unshackle
      S3_SECRET_KEY: ${UNSHACKLE_LIVE_PG_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "${UNSHACKLE_LIVE_LIGHTDASH_PORT:-58080}:8080"
