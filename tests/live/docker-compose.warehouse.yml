# The warehouse every live test shares: Postgres, loaded from tests/live/data/<dataset>/*.parquet
# by harness.Stack.load_data(). Layer a tool's compose file on top:
#   docker-compose -p unshackle-live-<tool> -f tests/live/docker-compose.warehouse.yml -f tests/live/<tool>/docker-compose.yml up -d
# The password is generated per run by the harness (UNSHACKLE_LIVE_PG_PASSWORD).
services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unshackle
      POSTGRES_PASSWORD: ${UNSHACKLE_LIVE_PG_PASSWORD:?set by tests/live/harness.py}
      POSTGRES_DB: dunder_mifflin
    ports:
      - "${UNSHACKLE_LIVE_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unshackle -d dunder_mifflin"]
      interval: 2s
      retries: 30
