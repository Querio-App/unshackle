# Metabase v0.64.1 (open source), layered on tests/live/docker-compose.warehouse.yml.
services:
  metabase:
    image: metabase/metabase:v0.64.1
    environment:
      MB_DB_TYPE: h2
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
    ports:
      - "${UNSHACKLE_LIVE_METABASE_PORT:-3300}:3000"
    depends_on:
      warehouse: {condition: service_healthy}
