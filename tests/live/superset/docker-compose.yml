# Apache Superset 6.1.0 (plus the Postgres driver, see Dockerfile), layered on tests/live/docker-compose.warehouse.yml.
services:
  superset:
    build: superset  # paths are relative to tests/live, the directory of the first compose file
    pull_policy: build
    image: unshackle-live-superset:6.1.0
    environment:
      SUPERSET_CONFIG_PATH: /app/unshackle/superset_config.py
      SUPERSET_SECRET_KEY: ${UNSHACKLE_LIVE_SECRET:?set by tests/live/harness.py}
    volumes: ["./superset/superset_config.py:/app/unshackle/superset_config.py:ro"]
    command: ["sh", "-c", "superset db upgrade && superset fab create-admin --username admin --firstname Ada --lastname Admin --email admin@example.com --password Unshackle-test-1! && superset init && gunicorn -w 2 -k gthread --threads 4 -b 0.0.0.0:8088 --timeout 120 'superset.app:create_app()'"]
    ports:
      - "${UNSHACKLE_LIVE_SUPERSET_PORT:-8188}:8088"
    depends_on:
      warehouse: {condition: service_healthy}
