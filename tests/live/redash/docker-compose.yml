# Redash 26.9.0 (getredash/setup's production compose, trimmed to one worker), layered on
# tests/live/docker-compose.warehouse.yml. Secrets are generated per run by tests/live/harness.py.
x-redash: &redash
  image: redash/redash:26.9.0
  depends_on:
    metadata: {condition: service_healthy}
    redis: {condition: service_started}
  environment: &redash-env
    REDASH_DATABASE_URL: postgresql://redash:${UNSHACKLE_LIVE_PG_PASSWORD:?set by tests/live/harness.py}@metadata/redash
    REDASH_REDIS_URL: redis://redis:6379/0
    REDASH_COOKIE_SECRET: ${UNSHACKLE_LIVE_SECRET:?set by tests/live/harness.py}
    REDASH_SECRET_KEY: ${UNSHACKLE_LIVE_SECRET}
    REDASH_LOG_LEVEL: WARNING
services:
  metadata:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: redash
      POSTGRES_PASSWORD: ${UNSHACKLE_LIVE_PG_PASSWORD}
      POSTGRES_DB: redash
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "redash", "-d", "redash"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
  server:
    <<: *redash
    command: server
    ports:
      - "${UNSHACKLE_LIVE_REDASH_PORT:-5055}:5000"
    environment:
      <<: *redash-env
      REDASH_WEB_WORKERS: 2
  scheduler:
    <<: *redash
    command: scheduler
  worker:
    <<: *redash
    command: worker
    environment:
      <<: *redash-env
      QUEUES: "queries,scheduled_queries,schemas,periodic,emails,default"
      WORKERS_COUNT: 2
