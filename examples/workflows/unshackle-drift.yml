# Copy into your context repository's .github/workflows/. This is NOT active here.
name: Unshackle warehouse drift
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1-5'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: unshackle-drift
  cancel-in-progress: false
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unshackle and the warehouse driver
        env:
          # Set this repository variable to a reviewed release/commit containing drift.
          UNSHACKLE_REF: ${{ vars.UNSHACKLE_REF || 'main' }}
        run: python -m pip install "unshackle[mcp] @ git+https://github.com/Querio-App/unshackle.git@${UNSHACKLE_REF}" 'psycopg[binary]'
      - name: Refresh configured imports and inspect references
        id: refresh
        env:
          UNSHACKLE_WAREHOUSE_URL: ${{ secrets.UNSHACKLE_WAREHOUSE_URL }}
        run: >-
          python -m unshackle.drift --repo . --config migration/imports.json
          --report "$RUNNER_TEMP/unshackle-drift.md" --github-output "$GITHUB_OUTPUT"
      - name: Create or update drift pull request
        if: steps.refresh.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/unshackle-drift
          title: 'Refresh warehouse schema and imported context'
          commit-message: 'Refresh warehouse schema and imported context'
          signoff: true
          body-path: ${{ runner.temp }}/unshackle-drift.md
          add-paths: ${{ steps.refresh.outputs.paths }}
