[project]
name = "unshackle"
version = "0.1.0"
description = "Unshackle your BI tool: extract metrics, dashboards and permissions from Looker, Tableau, Power BI, Lightdash, Omni, Hex, Sigma and ThoughtSpot into open formats in a Git repo you own."
dynamic = ["readme"]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
looker = ["lkml>=1.3"]
run = ["altair>=5.4", "pandas>=2.2", "sqlalchemy>=2.0", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]
sql = ["sqlglot>=25"]
live = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "lkml>=1.3", "altair>=5.4", "pandas>=2.2", "sqlalchemy>=2.0", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29", "duckdb>=1.0", "duckdb-engine>=0.13", "sqlglot>=25", "jsonschema>=4.18"]

[project.urls]
Repository = "https://github.com/Querio-App/unshackle"
Issues = "https://github.com/Querio-App/unshackle/issues"
Changelog = "https://github.com/Querio-App/unshackle/blob/main/CHANGELOG.md"

[project.scripts]
unshackle = "unshackle.cli:main"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unshackle"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "unshackle/_data/skills"
"spec" = "unshackle/_data/spec"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: runs a real BI tool in Docker; skipped unless UNSHACKLE_LIVE=1 (tests/live/README.md)"]

# GitHub renders the banner from its relative path; PyPI needs an absolute URL.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="assets/'
replacement = 'src="https://raw.githubusercontent.com/Querio-App/unshackle/main/assets/'
