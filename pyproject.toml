[project]
name = "unshackle"
version = "0.1.0"
description = "Move your metrics, dashboards and permissions out of a BI tool and into files in a Git repository you own."
dynamic = ["readme"]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  # running the notebooks
  "altair>=5.4",
  "pandas>=2.2",
  "sqlalchemy>=2.0",
  "nbformat>=5.9",
  "nbclient>=0.10",
  "ipykernel>=6.29",
  # sources and local data
  "lkml>=1.3",
  "websockets>=13",
  "boto3>=1.34",
  "duckdb>=1.0",
  "duckdb-engine>=0.13",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# Tableau's Hyper API is large and has wheels for fewer platforms: only copying .hyper extracts needs it
hyper = ["tableauhyperapi>=0.0.26479"]
dev = ["pytest>=8", "sqlglot>=25", "jsonschema>=4.18", "tableauhyperapi>=0.0.26479"]

[project.urls]
Repository = "https://github.com/Querio-App/unshackle"
Issues = "https://github.com/Querio-App/unshackle/issues"
Changelog = "https://github.com/Querio-App/unshackle/blob/main/CHANGELOG.md"

[project.scripts]
unshackle = "unshackle.cli:main"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unshackle"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "unshackle/_data/skills"
"spec" = "unshackle/_data/spec"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# GitHub renders the banner from its relative path; PyPI needs an absolute URL.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="assets/'
replacement = 'src="https://raw.githubusercontent.com/Querio-App/unshackle/main/assets/'
