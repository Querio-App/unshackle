name: dco
on: pull_request

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        run: |
          missing=0
          for sha in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha is missing a Signed-off-by line. See CONTRIBUTING.md."
              missing=1
            fi
          done
          exit $missing
