name: live
# Live tests against real BI tools in Docker (tests/live/README.md). Slow and heavy, so
# not on pull requests: run by hand or weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the Lightdash image is ~15 GB unpacked)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv venv --python 3.12 && uv pip install -e ".[dev,live]"
      - run: uv venv /tmp/dbt && uv pip install --python /tmp/dbt/bin/python "dbt-core~=1.10.0" "dbt-postgres~=1.9"
      - run: .venv/bin/pytest tests/live -m live -s -v
        env:
          UNSHACKLE_LIVE: "1"
          UNSHACKLE_LIVE_DBT: /tmp/dbt/bin/dbt
